name: BrainNew tests

on:
  push:
    branches:
      - merge/brainnew-learning-sprint
  pull_request:
    paths:
      - "BrainNew/**"
      - ".github/workflows/brainnew-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run BrainNew tests
        run: python -m pytest BrainNew/tests -v
      - name: Run prototype smoke test
        run: python -m BrainNew.main
